name: Deploy to GitHub Pages

# The github-pages environment only accepts deployments from the default
# branch, so a run from anywhere else fails at the deploy step by design.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; never deploy two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app has no dependencies, so the tests run straight away.
      - name: Test
        run: npm test

      # Fails if public/ changed without rebuilding the copy at the repository
      # root, which is what a branch-based Pages build serves.
      - name: Build the static site
        run: node tools/build-pages.js --check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already serving from Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
